# GitVersion 6 syntax follows Packata's GitHubFlow configuration.
# Keep Mainline calculation: Streamistry publishes patch builds without tagging each one.
workflow: GitHubFlow/v1
strategies:
  - Mainline
tag-prefix: 'v'

major-version-bump-message: "^(feat|fix|perf|refactor|revert|build|ci|chore|docs|style|test)(\\([\\w\\s-]*\\))?(!:|:.*\\n\\n((.+\\n)+\\n)?BREAKING CHANGE:\\s.+)|\\+semver:\\s?(breaking|major)"
minor-version-bump-message: "^(feat)(\\([\\w\\s-]*\\))?:|\\+semver:\\s?(feature|minor)"
# Default to a patch for any commit, as main's Patch increment did previously.
# Explicit major/minor/none messages take precedence. Keep main's fallback None
# so GitVersion 6 does not turn an explicit +semver: none into another patch.
patch-version-bump-message: '(?s)^.+$'
no-bump-message: "\\+semver:\\s?(none|skip)"
commit-message-incrementing: Enabled
branches:
  main:
    regex: ^main$
    is-main-branch: true
    increment: None
    mode: ContinuousDeployment
  feature:
    label: beta.{BranchName}
    regex: ^(feat(ure)?s?)[/-](?<BranchName>.+)
    increment: Minor
    source-branches:
      - main
      - feature
  maintenance:
    mode: ContinuousDelivery
    label: '{BranchName}'
    regex: ^(?<BranchName>(fix|refactor|perf|docs|test|chore)[/-].+)
    increment: Inherit
    source-branches:
      - main
  release:
    label: rc.{BranchName}
    regex: ^releases?[/-](?<BranchName>.+)
    increment: Major
    source-branches:
      - main
ignore:
  sha: []
merge-message-formats: {}
